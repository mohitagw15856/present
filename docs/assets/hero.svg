<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Present: small tools for putting the phone down">
  <defs>
    <style>
      .t { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #2b2823; }
      .h { font-size: 64px; font-weight: 500; letter-spacing: -1.5px; }
      .s { font-size: 24px; fill: #7a736a; }
      .k { font-size: 15px; letter-spacing: 2.5px; fill: #7a736a; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1200" height="340" rx="28" fill="#fbf8f2"/>

  <!-- breathing circle -->
  <g transform="translate(940 170)">
    <circle r="110" fill="#c9d8c8">
      <animate attributeName="r" values="104;118;118;104" keyTimes="0;0.4;0.55;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1"/>
    </circle>
    <!-- phone: stands up, then lies down to rest -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;0;90;90;0" keyTimes="0;0.15;0.45;0.85;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1;0.45 0 0.2 1"/>
      <rect x="-26" y="-58" width="52" height="116" rx="12" fill="#5b7460"/>
      <rect x="-19" y="-48" width="38" height="92" rx="7" fill="#fbf8f2" opacity="0.92"/>
      <!-- screen "content" fades as it lies down -->
      <g fill="#c9d8c8">
        <rect x="-12" y="-36" width="24" height="5" rx="2.5"/>
        <rect x="-12" y="-24" width="18" height="5" rx="2.5"/>
        <rect x="-12" y="-12" width="22" height="5" rx="2.5"/>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.15;0.45;0.85;1" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- copy -->
  <text class="t k" x="80" y="112">PRESENT</text>
  <text class="t h" x="80" y="180">Tools for putting</text>
  <text class="t h" x="80" y="246">the phone down.</text>
  <text class="t s" x="80" y="292">No accounts. No feeds. No streaks. Nothing that buzzes.</text>

  <!-- three slow dots, like a conversation pausing -->
  <g fill="#dcaaab">
    <circle cx="82" cy="60" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="60" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="60" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
